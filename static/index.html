<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orca Cloud Connector</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0:#0a0e14;--bg-1:#0f1419;--bg-2:#161b22;--bg-3:#1c2128;--bg-4:#21262d;
      --brd:#30363d;--brd-h:#484f58;
      --t1:#e6edf3;--t2:#8b949e;--t3:#6e7681;
      --ac:#58a6ff;--ac-h:#79c0ff;
      --ok:#3fb950;--warn:#d29922;--err:#f85149;--pur:#bc8cff;
      --r:10px;--rs:6px;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-0);color:var(--t1);min-height:100vh}
    .app{max-width:840px;margin:0 auto;padding:16px 16px 80px}

    .hdr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--brd);margin-bottom:16px}
    .hdr-t{font-size:17px;font-weight:600;background:linear-gradient(135deg,var(--ac),var(--pur));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

    .acard{background:var(--bg-2);border:1px solid var(--brd);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .acard-icon{font-size:18px;flex-shrink:0}
    .acard-info{flex:1;min-width:0}
    .acard-label{font-size:11px;color:var(--t3);margin-bottom:2px}
    .acard-status{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .acard-status.on{color:var(--ok)}.acard-status.off{color:var(--t3)}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--err);flex-shrink:0}
    .dot.on{background:var(--ok);box-shadow:0 0 5px rgba(63,185,80,.4)}

    .btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:var(--rs);font-size:11px;font-weight:500;font-family:inherit;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
    .btn:active{transform:scale(.97)}.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
    .bp{background:var(--ac);color:#fff}.bp:hover{background:var(--ac-h)}
    .bg{background:var(--ok);color:#fff}.bg:hover{opacity:.9}
    .bd{background:transparent;color:var(--err);border:1px solid rgba(248,81,73,.3)}.bd:hover{background:rgba(248,81,73,.08)}
    .bo{background:var(--bg-3);color:var(--t2);border:1px solid var(--brd)}.bo:hover{color:var(--t1);border-color:var(--brd-h)}
    .bs{padding:3px 8px;font-size:10px}

    .tabs{display:flex;gap:0;border-bottom:1px solid var(--brd);margin-bottom:14px}
    .tab{padding:8px 16px;font-size:12px;font-weight:500;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
    .tab:hover{color:var(--t2)}
    .tab.active{color:var(--ac);border-bottom-color:var(--ac)}
    .tab .cnt{font-size:10px;background:var(--bg-3);padding:0 5px;border-radius:8px;margin-left:4px}
    .tab-panel{display:none}.tab-panel.active{display:block}

    .toolbar{display:flex;gap:6px;margin-bottom:10px;align-items:center}
    .toolbar-fill{flex:1}

    .card{background:var(--bg-2);border:1px solid var(--brd);border-radius:var(--r);padding:14px;margin-bottom:6px;transition:border-color .15s}
    .card:hover{border-color:var(--brd-h)}
    .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px}
    .card-name{font-size:14px;font-weight:600;color:var(--ac)}
    .card-desc{font-size:11px;color:var(--t2);margin-bottom:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card-path{font-size:10px;color:var(--t3);font-family:'SF Mono',Consolas,monospace;background:var(--bg-3);padding:1px 5px;border-radius:3px;display:inline-block;margin-bottom:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
    .badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
    .badge{font-size:9px;padding:1px 5px;border-radius:8px;font-weight:500}
    .b-pub{background:rgba(63,185,80,.12);color:var(--ok);border:1px solid rgba(63,185,80,.2)}
    .b-new{background:rgba(210,153,34,.12);color:var(--warn);border:1px solid rgba(210,153,34,.2)}
    .b-whl{background:rgba(188,140,255,.12);color:var(--pur);border:1px solid rgba(188,140,255,.2)}
    .b-man{background:rgba(88,166,255,.12);color:var(--ac);border:1px solid rgba(88,166,255,.2)}
    .b-err{background:rgba(248,81,73,.12);color:var(--err);border:1px solid rgba(248,81,73,.2)}
    .card-acts{display:flex;gap:5px;align-items:center;flex-wrap:wrap}

    .log{background:var(--bg-1);border:1px solid var(--brd);border-radius:var(--rs);padding:6px 10px;margin-top:6px;font-size:10px;font-family:'SF Mono',Consolas,monospace;color:var(--t2);max-height:140px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
    .log .ok{color:var(--ok)}.log .er{color:var(--err)}.log .in{color:var(--ac)}

    .toasts{position:fixed;bottom:16px;right:16px;z-index:999;display:flex;flex-direction:column;gap:5px}
    .toast{padding:8px 14px;border-radius:var(--rs);font-size:11px;font-weight:500;box-shadow:0 4px 24px rgba(0,0,0,.5);animation:si .2s ease-out;max-width:340px}
    .t-ok{background:#152d1e;color:var(--ok);border:1px solid rgba(63,185,80,.2)}
    .t-er{background:#2d1517;color:var(--err);border:1px solid rgba(248,81,73,.2)}
    .t-in{background:#15202d;color:var(--ac);border:1px solid rgba(88,166,255,.2)}
    @keyframes si{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}

    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center}
    .modal{background:var(--bg-2);border:1px solid var(--brd);border-radius:var(--r);padding:20px;max-width:480px;width:92%;box-shadow:0 8px 40px rgba(0,0,0,.5);max-height:85vh;overflow-y:auto}
    .modal h3{font-size:15px;margin-bottom:4px}
    .modal .sub{font-size:11px;color:var(--t3);margin-bottom:14px}
    .modal label{display:block;font-size:11px;color:var(--t2);margin-bottom:3px;font-weight:500}
    .modal input,.modal textarea,.modal select{width:100%;padding:6px 9px;border-radius:var(--rs);border:1px solid var(--brd);background:var(--bg-3);color:var(--t1);font-size:11px;font-family:inherit;outline:none;margin-bottom:8px}
    .modal input:focus,.modal textarea:focus{border-color:var(--ac)}
    .modal textarea{height:50px;resize:vertical;font-family:'SF Mono',Consolas,monospace}
    .modal select{appearance:auto}
    .modal .row{display:flex;gap:8px}.modal .row>div{flex:1}
    .modal-acts{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}

    .empty{text-align:center;padding:28px 16px;color:var(--t3)}
    .empty-i{font-size:28px;margin-bottom:8px;opacity:.35}
    .empty-t{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:3px}
    .empty-d{font-size:11px;max-width:280px;margin:0 auto}
    .spinner{display:inline-block;width:10px;height:10px;border:2px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:sp .5s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:2px}
  </style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <span style="font-size:20px">🐙</span>
    <span class="hdr-t">Orca Cloud Connector</span>
  </div>
  <div class="acard" id="auth-orca"></div>
  <div class="tabs">
    <div class="tab active" data-tab="plugins">My Plugins <span class="cnt" id="plCnt">0</span></div>
    <div class="tab" data-tab="cloud">Orca Cloud <span class="cnt" id="clCnt">0</span></div>
  </div>
  <div class="tab-panel active" id="panel-plugins">
    <div class="toolbar">
      <div class="toolbar-fill"></div>
      <button class="btn bp bs" onclick="linkLocalRepo()">📂 Link Repo</button>
    </div>
    <div id="pluginList"></div>
  </div>
  <div class="tab-panel" id="panel-cloud"><div id="cloudList"></div></div>
</div>
<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script>
// ===================== Helpers =====================
const api = () => window.pywebview.api;

function toast(m, t = 'in') {
  const c = document.getElementById('toasts'), d = document.createElement('div');
  d.className = `toast t-${t}`; d.textContent = m; c.appendChild(d);
  setTimeout(() => d.remove(), 4000);
}
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escJ(s) { return (s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
function emptyBox(icon, title, desc) {
  return `<div class="empty"><div class="empty-i">${icon}</div><div class="empty-t">${title}</div><div class="empty-d">${desc}</div></div>`;
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + t.dataset.tab));
  });
});

// ===================== Orca Cloud Auth =====================
const authEl = document.getElementById('auth-orca');
let authState = { authenticated: false };

async function checkAuth() {
  try { authState = await api().get_auth_status(); } catch { authState = { authenticated: false }; }
  renderAuth();
  if (authState.authenticated) loadCloud();
}

function renderAuth() {
  const on = authState.authenticated;
  const display = on ? (authState.email || 'Connected') : 'Not connected';
  authEl.innerHTML = `
    <span class="acard-icon">☁️</span>
    <div class="acard-info">
      <div class="acard-label">Orca Cloud</div>
      <div class="acard-status ${on ? 'on' : 'off'}">${esc(display)}</div>
    </div>
    <div class="dot ${on ? 'on' : ''}"></div>
    ${on
      ? `<button class="btn bd bs" data-action="logout">×</button>`
      : `<button class="btn bp bs" data-action="login">Login</button>`}`;
  authEl.querySelector('[data-action]').addEventListener('click', e =>
    e.target.dataset.action === 'login' ? doLogin() : doLogout()
  );
}

async function doLogin() {
  const btn = authEl.querySelector('[data-action="login"]');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  toast('Opening Orca Cloud login in browser...');
  try {
    const r = await api().login();
    if (r.ok) { toast('Orca Cloud: connected!', 'ok'); await checkAuth(); }
    else { toast(r.error || 'Login failed', 'er'); renderAuth(); }
  } catch (e) { toast(e.message || 'Login error', 'er'); renderAuth(); }
}

async function doLogout() {
  try { await api().logout(); authState = { authenticated: false }; renderAuth(); toast('Orca Cloud: disconnected'); }
  catch (e) { toast(e.message, 'er'); }
}

// ===================== My Plugins =====================
let plugins = [];

async function loadPlugins() {
  try {
    const d = await api().get_repos();
    plugins = d.repos || [];
    document.getElementById('plCnt').textContent = plugins.length;
    renderPlugins();
  } catch (e) { toast(e.message, 'er'); }
}

function renderPlugins() {
  const c = document.getElementById('pluginList');
  if (!plugins.length) {
    c.innerHTML = emptyBox('📂', 'No plugins linked', 'Click "Link Repo" to add a local plugin repository.');
    return;
  }
  c.innerHTML = plugins.map(renderPluginCard).join('');
}

function renderPluginCard(p) {
  const bb = [
    p.is_published ? '<span class="badge b-pub">☁️ Published</span>' : '<span class="badge b-new">🆕 New</span>',
    p.has_wheel ? '<span class="badge b-whl">📦 .whl</span>' : null,
    p.has_manifest ? '<span class="badge b-man">📋 Manifest</span>' : '<span class="badge b-err">⚠ No manifest</span>',
  ].filter(Boolean).join('');
  const canBuild = p.has_build_script && p.exists;
  const canPub = canBuild && authState.authenticated && p.has_manifest;
  return `<div class="card">
    <div class="card-top"><div><span class="card-name">${esc(p.name || '?')}</span>${p.version ? ` <span style="font-size:10px;color:var(--t3)">v${esc(p.version)}</span>` : ''}</div>
      <button class="btn bo bs" onclick="unregister('${escJ(p.path)}')" title="Unlink">✕</button></div>
    ${p.description ? `<div class="card-desc">${esc(p.description)}</div>` : ''}
    <div class="card-path">${esc(p.path)}</div>
    <div class="badges">${bb}</div>
    <div class="card-acts">
      ${!p.has_manifest ? `<button class="btn bp bs" onclick="showManifestFormForPath('${escJ(p.path)}')">📝 Create Manifest</button>` : ''}
      <button class="btn bo bs" onclick="runAction('build','${escJ(p.path)}')" ${canBuild ? '' : 'disabled'}>🔨 Build</button>
      <button class="btn ${p.is_published ? 'bg' : 'bp'} bs" onclick="runAction('publish','${escJ(p.path)}')" ${canPub ? '' : 'disabled'}>${p.is_published ? '🔄 Update' : '🚀 Publish'}</button>
      ${p.cloud_url ? `<a href="${esc(p.cloud_url)}" target="_blank" style="font-size:10px;color:var(--ac);text-decoration:none">↗ Cloud</a>` : ''}
    </div>
    <div id="log-${encodeURIComponent(p.path)}" style="display:none"></div></div>`;
}

async function linkLocalRepo() {
  // pywebview native folder picker
  try {
    const result = await window.pywebview.api.pick_folder();
    if (!result) return;
    const r = await api().link_repo(result);
    if (r.ok !== false) {
      toast('Linked: ' + (r.name || result), 'ok');
      await loadPlugins();
      if (!r.has_manifest) showManifestForm(r);
    } else {
      toast(r.error, 'er');
    }
  } catch (e) { toast(e.message, 'er'); }
}

async function unregister(p) {
  try { await api().unlink_repo(p); toast('Unlinked'); loadPlugins(); }
  catch (e) { toast(e.message, 'er'); }
}

// ===================== Build & Publish =====================
function logMsg(path, msg, cls = '') {
  const id = 'log-' + encodeURIComponent(path), el = document.getElementById(id);
  if (!el) return;
  el.style.display = '';
  if (!el.querySelector('.log')) el.innerHTML = '<div class="log"></div>';
  el.querySelector('.log').innerHTML += `<div class="${cls}">${esc(msg)}</div>`;
  el.querySelector('.log').scrollTop = 9999;
}

async function runAction(action, path) {
  logMsg(path, `${action === 'build' ? '🔨 Building' : '🚀 Publishing'}...`, 'in');
  try {
    const r = await api()[action](path);
    if (!r.ok) { logMsg(path, '❌ ' + r.error, 'er'); toast(`${action} failed`, 'er'); return; }
    if (action === 'build') { logMsg(path, `✅ ${r.wheel} (${(r.size/1024).toFixed(1)}KB)`, 'ok'); toast('Built: ' + r.wheel, 'ok'); }
    else { logMsg(path, `✅ ${r.action}: v${r.version}`, 'ok'); toast('Plugin ' + r.action + '!', 'ok'); loadCloud(); }
    loadPlugins();
  } catch (e) { logMsg(path, '❌ ' + e.message, 'er'); toast(`${action} failed`, 'er'); }
}

// ===================== Manifest Form =====================
async function showManifestFormForPath(path) {
  try { showManifestForm(await api().detect_metadata(path)); } catch (e) { toast(e.message, 'er'); }
}

function showManifestForm(info) {
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>📝 Create Plugin Manifest</h3><div class="sub">Fill in details for plugin_manifest.json:</div>
    <input type="hidden" id="mf_path" value="${esc(info.path || '')}" />
    <div class="row"><div><label>Name *</label><input id="mf_name" value="${esc(info.name || '')}" /></div>
      <div><label>Import Name *</label><input id="mf_import" value="${esc(info.import_name || '')}" /></div></div>
    <div class="row"><div><label>Version</label><input id="mf_version" value="${esc(info.version || '0.1.0')}" /></div>
      <div><label>Author</label><input id="mf_author" value="${esc(info.author || '')}" /></div></div>
    <label>Description</label><textarea id="mf_desc">${esc(info.description || '')}</textarea>
    <label>Homepage</label><input id="mf_homepage" value="${esc(info.git_remote || info.homepage || '')}" />
    <div class="row"><div><label>License</label><input id="mf_license" value="MIT" /></div>
      <div><label>Plugin Type</label><select id="mf_type"><option value="script">Script</option><option value="slicing_pipeline">Slicing Pipeline</option><option value="printer_agent">Printer Agent</option></select></div></div>
    <label>Tags (comma separated)</label><input id="mf_tags" placeholder="gcode, temperature" />
    <div class="modal-acts"><button class="btn bo" onclick="closeModal()">Cancel</button><button class="btn bp" onclick="submitManifest()">💾 Create</button></div>
  </div></div>`;
}

async function submitManifest() {
  const name = document.getElementById('mf_name').value.trim(), imp = document.getElementById('mf_import').value.trim();
  if (!name || !imp) return toast('Name and Import Name required', 'er');
  const tagsRaw = document.getElementById('mf_tags').value.trim();
  try {
    const r = await api().init_manifest(
      document.getElementById('mf_path').value, name, imp,
      document.getElementById('mf_version').value.trim() || '0.1.0',
      document.getElementById('mf_desc').value.trim(),
      document.getElementById('mf_author').value.trim(),
      document.getElementById('mf_homepage').value.trim(),
      document.getElementById('mf_license').value.trim() || 'MIT',
      [document.getElementById('mf_type').value],
      tagsRaw ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean) : []
    );
    if (r.ok) { closeModal(); toast('Manifest created', 'ok'); loadPlugins(); }
    else toast(r.error, 'er');
  } catch (e) { toast(e.message, 'er'); }
}

// ===================== Cloud =====================
async function loadCloud() {
  if (!authState.authenticated) {
    document.getElementById('cloudList').innerHTML = emptyBox('☁️', 'Connect Orca Cloud', 'Login to see published plugins.');
    document.getElementById('clCnt').textContent = '0'; return;
  }
  try {
    const d = await api().get_cloud_plugins(), ps = d.plugins || [];
    document.getElementById('clCnt').textContent = ps.length;
    const c = document.getElementById('cloudList');
    if (!ps.length) { c.innerHTML = emptyBox('☁️', 'No cloud plugins', 'Publish your first plugin!'); return; }
    c.innerHTML = ps.map(p => `<div class="card"><div class="card-top"><span class="card-name">${esc(p.name || '?')}</span>${p.version ? ` <span style="font-size:10px;color:var(--t3)">v${esc(p.version)}</span>` : ''}</div>
      ${p.description ? `<div class="card-desc">${esc(p.description)}</div>` : ''}
      <div class="badges"><span class="badge b-pub">☁️ Published</span></div>
      ${p.sharing_token ? `<a href="https://cloud.orcaslicer.com/p/${esc(p.sharing_token)}" target="_blank" style="font-size:10px;color:var(--ac);text-decoration:none">↗ View</a>` : ''}</div>`).join('');
  } catch (e) { toast('Cloud: ' + e.message, 'er'); }
}

// ===================== Init =====================
window.addEventListener('pywebviewready', async () => {
  await checkAuth();
  await loadPlugins();
});
</script>
</body>
</html>
